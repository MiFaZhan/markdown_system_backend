version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: markdown-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=markdown_system
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./sql/markdown_system.sql:/docker-entrypoint-initdb.d/markdown_system.sql
    restart: unless-stopped

  backend:
    build: .
    image: markdown-system:backend
    container_name: markdown-backend
    depends_on:
      - mysql
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - FILE_UPLOAD_PATH=${FILE_UPLOAD_PATH}
      - FILE_MAX_SIZE=${FILE_MAX_SIZE}
      - FILE_URL_PREFIX=${FILE_URL_PREFIX}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ../markdown_system_frontend
    image: markdown_system:frontend
    container_name: markdown-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
