server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/markdown_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-password}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss

  web:
    resources:
      add-mappings: true
  mvc:
    throw-exception-if-no-handler-found: false
    static-path-pattern: /static/**

mybatis-plus:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

file:
  upload:
    path: ${FILE_UPLOAD_PATH:your-upload-path}
    max-size: ${FILE_MAX_SIZE:5242880}
    url-prefix: ${FILE_URL_PREFIX:/api/images}

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:your-allowed-origins}
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600
  path-mapping: "/api/**"